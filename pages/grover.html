<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grover Amplitude Amplification</title>
    <script src="../js/panels.js"></script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/grover.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="info">
      <h2>Grover Quantum Search</h2>
      <p>Geometric rotation in the (|s'⟩, |w⟩) subspace via U_s · U_ω.</p>
      <div class="equation">
        U_ω = I − 2|w⟩⟨w|   (phase oracle)<br />
        U_s = 2|s⟩⟨s| − I   (mean inversion)<br />
        k_opt = ⌊(π/4) √N⌋
      </div>
      <p>Click any basis state bar on the right to mark |w⟩.</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Qubits n: <span id="n-val">3</span> (N = <span id="N-val">8</span>)</label>
        <input type="range" id="n-slider" min="2" max="4" step="1" value="3" />
      </div>
      <button id="step-btn">Step Grover (U_s U_ω)</button>
      <button id="auto-btn">Auto Optimal</button>
      <button id="reset-btn">Reset |s⟩</button>
      <div class="status" id="grover-out">Iteration 0 · P(w) = 12.5%</div>
    </div>

    <script src="../js/grover.js"></script>
  </body>
</html>
