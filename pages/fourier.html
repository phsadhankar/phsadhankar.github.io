<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fourier Transform</title>
    <link rel="stylesheet" href="../css/fourier.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="info">
      <h2>𝓕{f(t)} = F(ω) - Fourier Transform</h2>
      <div class="equation">
        F(ω) = ∫₋∞^∞ f(t)e^(-iωt) dt<br /><br />
        f(t) = (1/2π) ∫₋∞^∞ F(ω)e^(iωt) dω
      </div>
      <p style="font-size: 12px; margin: 10px 0">
        <strong>Top:</strong> Time Domain Signal f(t)<br />
        <strong>Bottom:</strong> Frequency Domain |F(ω)|<br />
        <strong>Circle:</strong> Complex exponential rotation
      </p>
    </div>

    <div class="controls">
      <h3 style="margin: 0 0 15px 0; font-size: 14px">Signal Components</h3>

      <div class="control-group">
        <label>Frequency 1: <span id="freq1-val">2.0</span> Hz</label>
        <input
          type="range"
          id="freq1"
          min="0.5"
          max="10"
          step="0.5"
          value="2"
        />
      </div>

      <div class="control-group">
        <label>Amplitude 1: <span id="amp1-val">1.0</span></label>
        <input type="range" id="amp1" min="0" max="2" step="0.1" value="1" />
      </div>

      <div class="control-group">
        <label>Frequency 2: <span id="freq2-val">5.0</span> Hz</label>
        <input
          type="range"
          id="freq2"
          min="0.5"
          max="10"
          step="0.5"
          value="5"
        />
      </div>

      <div class="control-group">
        <label>Amplitude 2: <span id="amp2-val">0.5</span></label>
        <input type="range" id="amp2" min="0" max="2" step="0.1" value="0.5" />
      </div>

      <div class="control-group">
        <label>Frequency 3: <span id="freq3-val">8.0</span> Hz</label>
        <input
          type="range"
          id="freq3"
          min="0.5"
          max="10"
          step="0.5"
          value="8"
        />
      </div>

      <div class="control-group">
        <label>Amplitude 3: <span id="amp3-val">0.3</span></label>
        <input type="range" id="amp3" min="0" max="2" step="0.1" value="0.3" />
      </div>

      <button id="preset1">Square Wave</button>
      <button id="preset2">Sawtooth</button>
      <button id="preset3">Noise</button>

      <div class="frequency-display" id="freq-info">Computing FFT...</div>
    </div>

    <script src="../js/fourier.js"></script>
  </body>
</html>
