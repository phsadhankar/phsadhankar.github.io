<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complex Flow Field</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/complex-flow.css" />
  </head>
  <body>
    <canvas id="flowCanvas"></canvas>

    <div class="ui-panel" id="info-panel">
      <h2>Complex Potential Flow</h2>
      <div class="eq-box">
        F(z) = φ + iψ (complex potential)<br />
        w = dF/dz (complex velocity)<br />
        z = x + iy ∈ ℂ
      </div>
      <div class="instruction">
        <strong>Visualization:</strong> Analytic complex functions as 2D flow
        fields<br />
        <strong>Lines:</strong> Streamlines (ψ = const)<br />
        <strong>Color:</strong> Velocity magnitude |w|
      </div>
    </div>

    <div class="ui-panel" id="control-panel">
      <div class="slider-group">
        <label>Flow Type:</label>
        <select id="flowType">
          <option value="uniform">Uniform Flow: F = Az</option>
          <option value="source">Source/Sink: F = A log(z)</option>
          <option value="vortex">Vortex: F = iA log(z)</option>
          <option value="dipole">Dipole: F = A/z</option>
          <option value="corner">Corner Flow: F = z²</option>
          <option value="cylinder">Flow around Cylinder</option>
          <option value="stagnation">Stagnation Point</option>
        </select>
      </div>

      <div class="slider-group">
        <label>Strength: <span id="strengthVal">1.0</span></label>
        <input
          type="range"
          id="strengthSlider"
          min="0.1"
          max="3"
          step="0.1"
          value="1"
        />
      </div>

      <div class="slider-group">
        <label>Flow Angle: <span id="angleVal">0°</span></label>
        <input
          type="range"
          id="angleSlider"
          min="0"
          max="360"
          step="15"
          value="0"
        />
      </div>

      <div class="slider-group">
        <label>Particles: <span id="particleVal">150</span></label>
        <input
          type="range"
          id="particleSlider"
          min="50"
          max="400"
          step="25"
          value="150"
        />
      </div>

      <button class="btn" id="resetBtn">Reset Particles</button>
    </div>

    <script src="../js/complex-flow.js"></script>
  </body>
</html>
