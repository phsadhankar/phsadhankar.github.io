<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bloch Sphere & Gate Composer</title>
    <script src="../js/panels.js"></script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/bloch-gates.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="info">
      <h2>Bloch Sphere & Gate Composer</h2>
      <p>Single-qubit SU(2) trajectory, statevector amplitudes, and circuit simplification.</p>
      <div class="equation">
        |ψ⟩ = cos(θ/2)|0⟩ + e^(iφ) sin(θ/2)|1⟩<br />
        P(0) = |α|²,  P(1) = |β|²
      </div>
      <p>Drag to rotate the Bloch sphere.</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Append Quantum Gate</label>
        <div class="gate-grid">
          <button class="gate-btn" data-gate="H">H</button>
          <button class="gate-btn" data-gate="X">X</button>
          <button class="gate-btn" data-gate="Y">Y</button>
          <button class="gate-btn" data-gate="Z">Z</button>
          <button class="gate-btn" data-gate="S">S</button>
          <button class="gate-btn" data-gate="T">T</button>
          <button class="gate-btn" data-gate="Rx">Rx(π/4)</button>
          <button class="gate-btn" data-gate="Ry">Ry(π/4)</button>
        </div>
      </div>
      <button id="opt-btn">Optimize Circuit</button>
      <button id="undo-btn">Undo</button>
      <button id="reset-btn">Reset |0⟩</button>
      <div class="status" id="state-out">|ψ⟩ = 1.000|0⟩ + 0.000|1⟩</div>
    </div>

    <script src="../js/bloch-gates.js"></script>
  </body>
</html>
