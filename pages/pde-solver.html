<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDE Solver</title>
    <script src="../js/panels.js"></script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/pde-solver.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="info">
      <h2>Interactive PDE Solver</h2>
      <p style="font-size: 12px; margin: 10px 0">
        Finite Difference Method for various PDEs
      </p>
      <div class="equation" id="equation-display">
        ∂u/∂t = α∇²u (Heat Equation)
      </div>
      <p style="font-size: 11px; margin: 10px 0">
        <strong>Click:</strong> Add heat source<br />
        <strong>Drag:</strong> Draw initial conditions
      </p>
    </div>

    <div class="controls">
      <h3 style="margin: 0 0 15px 0; font-size: 14px">PDE Configuration</h3>

      <div class="control-group">
        <label>Equation Type:</label>
        <select id="pde-type">
          <option value="heat">Heat Equation</option>
          <option value="wave">Wave Equation</option>
          <option value="laplace">Laplace Equation</option>
          <option value="poisson">Poisson Equation</option>
          <option value="diffusion">Reaction-Diffusion</option>
        </select>
      </div>

      <div class="control-group">
        <label>Diffusion Coeff (α): <span id="alpha-val">0.1</span></label>
        <input
          type="range"
          id="alpha"
          min="0.01"
          max="0.5"
          step="0.01"
          value="0.1"
        />
      </div>

      <div class="control-group">
        <label>Time Step (dt): <span id="dt-val">0.1</span></label>
        <input
          type="range"
          id="dt"
          min="0.01"
          max="0.5"
          step="0.01"
          value="0.1"
        />
      </div>

      <div class="control-group">
        <label>Boundary Condition:</label>
        <select id="boundary">
          <option value="dirichlet">Dirichlet (u=0)</option>
          <option value="neumann">Neumann (∂u/∂n=0)</option>
          <option value="periodic">Periodic</option>
        </select>
      </div>

      <button id="reset">Clear Field</button>
      <button id="toggle">Pause/Resume</button>
      <button id="preset">Load Preset</button>
    </div>

    <div class="stats-box">
      <div><strong>Time:</strong> <span id="time">0.00</span>s</div>
      <div><strong>Max Value:</strong> <span id="max-val">0.00</span></div>
      <div><strong>Total Energy:</strong> <span id="energy">0.00</span></div>
    </div>
    <script src="../js/pde-solver.js"></script>
  </body>
</html>
