<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schrödinger Wavepacket Tunneling</title>
    <script src="../js/panels.js"></script>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/wavepacket.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div class="info">
      <h2>1D Schrödinger Wavepacket</h2>
      <p>Unitary Crank–Nicolson integration preserving ∫|ψ|² dx = 1.</p>
      <div class="equation">
        iℏ ∂ψ/∂t = [−(ℏ²/2m) ∂²/∂x² + V(x)] ψ
      </div>
      <p>Vermilion: |ψ|² density · Cobalt: Re(ψ) · Slate: potential barrier V(x)</p>
    </div>

    <div class="controls">
      <div class="control-group">
        <label>Potential V(x)</label>
        <select id="potential">
          <option value="single">Single Barrier (Tunneling)</option>
          <option value="double">Double Barrier (Resonance)</option>
          <option value="harmonic">Harmonic Well ½kx²</option>
          <option value="free">Free Dispersion (V = 0)</option>
        </select>
      </div>
      <div class="control-group">
        <label>Barrier Height V₀: <span id="v0-val">1.6</span></label>
        <input type="range" id="v0" min="0.2" max="3.5" step="0.1" value="1.6" />
      </div>
      <div class="control-group">
        <label>Momentum k₀: <span id="k0-val">1.5</span></label>
        <input type="range" id="k0" min="0.6" max="2.6" step="0.1" value="1.5" />
      </div>
      <button id="launch-btn">Relaunch Packet</button>
      <button id="toggle-btn">Pause</button>
      <div class="status" id="tr-out">T = 0.00  R = 0.00  Norm = 1.000</div>
    </div>

    <script src="../js/wavepacket.js"></script>
  </body>
</html>
